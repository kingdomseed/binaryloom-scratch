<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>scratch.binaryloom.io</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4efe6;
    --ink: #10241f;
    --muted: #5c6f69;
    --line: #cfc6b6;
    --paper: #fffdf8;
    --accent: #1f6b5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Bricolage Grotesque", sans-serif; }
  body { min-height: 100vh; padding: 28px 22px 48px; }
  main { max-width: 720px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
  h1 { font-size: 22px; letter-spacing: -0.03em; margin: 0; }
  h1 span { color: var(--accent); }
  .count { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); }
  .lede { color: var(--muted); margin: 0 0 22px; max-width: 40rem; }
  ol { list-style: none; margin: 0; padding: 0; background: var(--paper); border: 1px solid var(--line); }
  li { border-top: 1px solid var(--line); }
  li:first-child { border-top: 0; }
  a.doc {
    display: grid; grid-template-columns: 1fr auto; gap: 8px 16px;
    text-decoration: none; color: inherit; padding: 16px 18px;
  }
  a.doc:hover { background: #f7f3ea; }
  a.doc:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .title { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .meta { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); }
  .open { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--accent); align-self: center; }
  .empty { padding: 28px 18px; color: var(--muted); }
  footer { margin-top: 22px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); }
  @media (max-width: 560px) {
    a.doc { grid-template-columns: 1fr; }
    .open { display: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1><span>scratch</span>.binaryloom.io</h1>
    <div class="count" id="count"></div>
  </header>
  <p class="lede">Temporary shares. Live while they’re useful, gone when they’re not.</p>
  <ol id="list"><li class="empty">Loading…</li></ol>
  <footer>https://scratch.binaryloom.io</footer>
</main>
<script>
  const list = document.getElementById("list");
  const count = document.getElementById("count");
  fetch("./live.json", { cache: "no-store" })
    .then((r) => {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then((items) => {
      if (!Array.isArray(items) || items.length === 0) {
        count.textContent = "0 live";
        list.innerHTML = '<li class="empty">Nothing up right now.</li>';
        return;
      }
      count.textContent = items.length === 1 ? "1 live" : items.length + " live";
      list.innerHTML = items.map((item) => {
        const slug = String(item.slug || "").replace(/^\/+|\/+$/g, "");
        const href = "./" + slug + "/";
        const title = item.title || slug;
        const bits = [item.note, "/" + slug + "/", item.added].filter(Boolean);
        return `<li><a class="doc" href="${href}">
          <div>
            <div class="title">${escapeHtml(title)}</div>
            <div class="meta">${escapeHtml(bits.join(" · "))}</div>
          </div>
          <div class="open">open →</div>
        </a></li>`;
      }).join("");
    })
    .catch(() => {
      count.textContent = "offline";
      list.innerHTML = '<li class="empty">Could not load live.json.</li>';
    });

  function escapeHtml(s) {
    return String(s)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");
  }
</script>
</body>
</html>
